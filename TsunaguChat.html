<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TsunaguChat</title>
    <meta name="description" content="TsunaguChatのインストールページへ。">

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f8faf9;
        color: #193d35;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        gap: 34px;
      }

      h1 {
        font-size: clamp(38px, 8vw, 68px);
        letter-spacing: -.045em;
        font-weight: 650;
        margin: 0;
      }

      .install-link {
        border: 0;
        border-radius: 100px;
        background: #22634f;
        color: white;
        padding: 17px 38px;
        font: 600 16px system-ui;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 14px;
        transition: background .2s, transform .2s;
      }

      .install-link:hover {
        background: #164936;
        transform: translateY(-2px);
      }

      .install-link:focus-visible {
        outline: 3px solid #81b7a3;
        outline-offset: 5px;
      }

      svg {
        width: 19px;
        height: 19px;
      }
      
      .rounded-image {
        border-radius: 20px;
        width: 650px;
      }
    </style>
  </head>

  <body>
    <main>
      <img src="Tsunagu.png" class="rounded-image" alt="画像">
      <h1>TsunaguChat</h1>

      <a class="install-link" href="https://github.com/Sakaban0/Tsunagu/releases/download/v1.6.0/TsunaguChat-1.6.0-Setup.exe" onclick="return confirm('インストールしますか？');">
        <span>アプリをインストール</span>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5" />
        </svg>
      </a>
    </main>

  </body>
</html>
